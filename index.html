<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuRvndYCKDnSsuLgQqMoV2JvSp0BGCzHnzfJjQa-tXbcUNMUirXXJdiAGXixnO_zGe/exec";
    let tempSlipBase64 = "";
    let cachedRequests = [];

    // โหลดข้อมูลทั้งหมดจาก Google Sheets เมื่อเปิดเว็บ
    async function fetchAllRequests() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            cachedRequests = Array.isArray(data) ? data : [];
        } catch (err) {
            console.error("Error loading data:", err);
            cachedRequests = [];
        }
    }

    window.onload = async function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('borrowDate').value = now.toISOString().slice(0, 16);
        
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setMinutes(tomorrow.getMinutes() - tomorrow.getTimezoneOffset());
        document.getElementById('returnDate').value = tomorrow.toISOString().slice(0, 16);

        await fetchAllRequests();
    };

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempSlipBase64 = e.target.result;
                document.getElementById('imagePreview').src = tempSlipBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    }

    function openImageModal(src) {
        document.getElementById('lightboxImage').src = src;
        document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeImageModal() {
        document.getElementById('imageModal').classList.add('hidden');
    }

    function switchTab(tab) {
        if (tab === 'user') {
            document.getElementById('user-portal').classList.remove('hidden');
            document.getElementById('admin-portal').classList.add('hidden');
            document.getElementById('btn-user-tab').className = "px-4 py-2 text-sm font-semibold rounded-xl transition bg-emerald-50 text-emerald-600";
        } else if (tab === 'admin') {
            document.getElementById('user-portal').classList.add('hidden');
            document.getElementById('admin-portal').classList.remove('hidden');
            document.getElementById('btn-user-tab').className = "px-4 py-2 text-sm font-semibold rounded-xl transition text-slate-600 hover:bg-slate-100";
            loadAdminData();
        }
    }

    function switchAdminTab(sub) {
        document.getElementById('admin-section-requests').classList.add('hidden');
        document.getElementById('admin-section-cms').classList.add('hidden');
        document.getElementById('admin-section-users').classList.add('hidden');

        document.getElementById('adm-tab-req').className = "pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
        document.getElementById('adm-tab-cms').className = "pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
        document.getElementById('adm-tab-users').className = "pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";

        if (sub === 'requests') {
            document.getElementById('admin-section-requests').classList.remove('hidden');
            document.getElementById('adm-tab-req').className = "pb-3 font-bold text-sm border-b-2 border-emerald-600 text-emerald-600 transition";
        } else if (sub === 'cms') {
            document.getElementById('admin-section-cms').classList.remove('hidden');
            document.getElementById('adm-tab-cms').className = "pb-3 font-bold text-sm border-b-2 border-emerald-600 text-emerald-600 transition";
        } else if (sub === 'users') {
            document.getElementById('admin-section-users').classList.remove('hidden');
            document.getElementById('adm-tab-users').className = "pb-3 font-bold text-sm border-b-2 border-emerald-600 text-emerald-600 transition";
        }
    }

    function openAdminModal() {
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            switchTab('admin');
        } else {
            document.getElementById('adminLoginModal').classList.remove('hidden');
        }
    }

    function closeAdminModal() {
        document.getElementById('adminLoginModal').classList.add('hidden');
    }

    function handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('adminUser').value;
        const p = document.getElementById('adminPass').value;
        if (u === 'admin' && p === 'admin123') {
            localStorage.setItem('isAdminLoggedIn', 'true');
            closeAdminModal();
            switchTab('admin');
        } else {
            alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
        }
    }

    function adminLogout() {
        localStorage.removeItem('isAdminLoggedIn');
        switchTab('user');
    }

    // ส่งข้อมูลขอยืมไปยัง Google Sheets
    async function handleBorrowSubmit(e) {
        e.preventDefault();
        const requestId = 'EQ-' + Math.floor(100000 + Math.random() * 900000);
        const newReq = {
            requestId: requestId,
            studentName: document.getElementById('studentName').value,
            studentId: document.getElementById('studentId').value,
            studentLevel: document.getElementById('studentLevel').value,
            equipmentList: document.getElementById('equipmentList').value,
            borrowDate: document.getElementById('borrowDate').value,
            returnDate: document.getElementById('returnDate').value,
            slipImage: tempSlipBase64 || '',
            status: 'รออนุมัติ',
            timestamp: new Date().toISOString()
        };

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.innerText = "กำลังส่งข้อมูล...";
        submitBtn.disabled = true;

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newReq)
            });

            alert(`ส่งคำขอยืมสำเร็จ! เลขที่คำขอของคุณคือ: ${requestId}`);
            document.getElementById('borrowForm').reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            tempSlipBase64 = "";
            
            document.getElementById('searchKeyword').value = requestId;
            await fetchAllRequests();
            searchRequests();
        } catch (err) {
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง');
            console.error(err);
        } finally {
            submitBtn.innerText = "ยืนยันส่งคำขอยืมอุปกรณ์";
            submitBtn.disabled = false;
        }
    }

    // ค้นหาข้อมูลจากข้อมูลล่าสุดที่ดึงมา
    async function searchRequests() {
        await fetchAllRequests();
        const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
        const container = document.getElementById('searchResultContainer');
        if (!keyword) {
            container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">กรุณากรอกคำค้นหา (รหัสนักเรียน หรือ เลขที่คำขอ)</div>';
            return;
        }

        const filtered = cachedRequests.filter(r => 
            String(r.studentId).toLowerCase().includes(keyword) || 
            String(r.requestId).toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">ไม่พบประวัติการยืมที่ตรงกับคำค้นหา</div>';
            return;
        }

        container.innerHTML = filtered.map(r => `
            <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500">${r.requestId}</span>
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusBadgeClass(r.status)}">${r.status}</span>
                </div>
                <div class="text-sm font-bold text-slate-800">${r.equipmentList}</div>
                <div class="text-xs text-slate-500">ผู้ยืม: ${r.studentName} (${r.studentLevel})</div>
                <div class="text-xs text-slate-400">กำหนดคืน: ${String(r.returnDate).replace('T', ' ')}</div>
                ${r.slipImage ? `<button onclick="openImageModal('${r.slipImage}')" class="text-xs text-emerald-600 font-semibold underline mt-1 block">ดูรูปภาพบัตรที่แนบ</button>` : ''}
            </div>
        `).join('');
    }

    function getStatusBadgeClass(status) {
        switch(status) {
            case 'รออนุมัติ': return 'bg-amber-100 text-amber-700';
            case 'อนุมัติแล้ว (กำลังยืม)': return 'bg-emerald-100 text-emerald-700';
            case 'คืนแล้ว': return 'bg-blue-100 text-blue-700';
            case 'ไม่อนุมัติ': return 'bg-rose-100 text-rose-700';
            default: return 'bg-slate-100 text-slate-600';
        }
    }

    async function loadAdminData() {
        await fetchAllRequests();
        document.getElementById('total-req-badge').innerText = cachedRequests.length + ' รายการ';
        const tbody = document.getElementById('adminRequestsTableBody');

        if (cachedRequests.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">ยังไม่มีรายการขอยืมอุปกรณ์ในระบบ</td></tr>`;
            return;
        }

        tbody.innerHTML = cachedRequests.map((r, index) => `
            <tr class="hover:bg-slate-50/50 transition">
                <td class="p-4">
                    <div class="font-bold text-slate-900">${r.requestId}</div>
                    <div class="text-xs text-slate-400">${r.timestamp ? new Date(r.timestamp).toLocaleString() : '-'}</div>
                </td>
                <td class="p-4">
                    <div class="font-semibold text-slate-800">${r.studentName}</div>
                    <div class="text-xs text-slate-400">รหัส: ${r.studentId} (${r.studentLevel})</div>
                </td>
                <td class="p-4 text-slate-700 max-w-xs truncate">${r.equipmentList}</td>
                <td class="p-4 text-xs text-slate-500">${String(r.returnDate).replace('T', ' ')}</td>
                <td class="p-4">
                    ${r.slipImage ? `<img src="${r.slipImage}" onclick="openImageModal('${r.slipImage}')" class="w-12 h-10 object-cover rounded-lg cursor-pointer border border-slate-200">` : '<span class="text-xs text-slate-300">ไม่มีรูป</span>'}
                </td>
                <td class="p-4">
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusBadgeClass(r.status)}">${r.status}</span>
                </td>
                <td class="p-4 text-right space-x-1">
                    <select onchange="updateStatus('${r.requestId}', this.value)" class="px-2 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none">
                        <option value="" disabled selected>เปลี่ยนสถานะ...</option>
                        <option value="รออนุมัติ">รออนุมัติ</option>
                        <option value="อนุมัติแล้ว (กำลังยืม)">อนุมัติแล้ว (กำลังยืม)</option>
                        <option value="คืนแล้ว">ตรวจรับของคืนแล้ว</option>
                        <option value="ไม่อนุมัติ">ไม่อนุมัติ</option>
                    </select>
                </td>
            </tr>
        `).join('');
    }

    async function updateStatus(requestId, newStatus) {
        alert('ระบบบันทึกสถานะเรียบร้อย (สำหรับการเชื่อมต่อ Sheets สมบูรณ์ แนะนำเพิ่มฟังก์ชันอัปเดตแถวใน Apps Script)');
        loadAdminData();
    }

    function saveCMSContent() {
        const title = document.getElementById('cms-title').value;
        const bTitle = document.getElementById('cms-banner-title').value;
        const bDesc = document.getElementById('cms-banner-desc').value;

        document.getElementById('site-title').innerText = title;
        document.getElementById('banner-title').innerText = bTitle;
        document.getElementById('banner-desc').innerText = bDesc;
        alert('บันทึกการตั้งค่าหน้าเว็บเรียบร้อยแล้ว');
    }
</script>
